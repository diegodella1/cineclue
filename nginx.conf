server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # LAN access: http://192.168.1.14:3100/cineclue/
    location = /cineclue {
        return 301 /cineclue/;
    }

    location /cineclue/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /cineclue/index.html;
    }

    location /cineclue/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tailscale Funnel: strips /cineclue prefix, sends / to container
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
